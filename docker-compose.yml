services:
    nginx:
        image: nginx:alpine
        ports:
            - '8080:8080'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - server

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5

    server:
        env_file:
            - ./backend/.env
        build:
            context: ./backend
            dockerfile: Dockerfile
        environment:
            - PORT=8080
            - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dashboard}
            - REDIS_URL=redis://redis:6379
        restart: on-failure
        deploy:
            replicas: 3
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    client:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '8081:80'

    db:
        image: postgres:15-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
            - POSTGRES_DB=${POSTGRES_DB:-dashboard}
        ports:
            - '5433:5432'
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dashboard}']
            interval: 5s
            timeout: 5s
            retries: 5

    ollama:
        image: ollama/ollama:latest
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama

volumes:
    db_data:
    ollama_data:
