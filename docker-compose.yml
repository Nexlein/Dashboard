version: '3.8'

services:
    server:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        environment:
            - PORT=8080
            - DATABASE_URL=postgres://user:password@db:5432/dashboard
            - JWT_SECRET=supersecretkey
        restart: on-failure
        depends_on:
            - db

    client:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '8081:80'

    db:
        image: postgres:15
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dashboard
        ports:
            - '5432:5432'
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data:
