services:
    nginx:
        restart: unless-stopped
        image: nginx:latest
        ports:
            - '8080:8080'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            server:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        restart: unless-stopped
        image: redis:7
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    init:
        build:
            context: .
            dockerfile: backend/Dockerfile
        command: ['node', 'docker/init.mjs']
        volumes:
            - auth_data:/run/dashboard

    server:
        env_file:
            - path: ./backend/.env
              required: false
        build:
            context: .
            dockerfile: backend/Dockerfile

        environment:
            - PORT=8080
            - DATABASE_URL=postgres://user:password@db:5432/dashboard
            - REDIS_URL=redis://redis:6379
            - AUTH_SECRET_FILE=/run/dashboard/auth-secret
            # Creates the demo accounts (README) at startup when missing. Remove on a real
            # deployment: their passwords are public.
            - SEED_DEMO_DATA=true
            # Without SMTP_HOST, the Docker launcher routes emails to the local inbox.
        volumes:
            - auth_data:/run/dashboard:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    'fetch("http://127.0.0.1:8080/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
                ]
            interval: 5s
            timeout: 5s
            start_period: 30s
            retries: 20
        restart: unless-stopped
        deploy:
            replicas: 3
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            init:
                condition: service_completed_successfully
            mailpit:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Local demo inbox; no external SMTP account is required.
    mailpit:
        image: axllent/mailpit:v1.31
        ports:
            - '127.0.0.1:8025:8025' # web inbox and API
            - '127.0.0.1:1025:1025' # SMTP
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 3s
            retries: 10

    client:
        restart: unless-stopped
        build:
            context: .
            dockerfile: frontend/Dockerfile
        environment:
            # API origin allowed by the frontend Content-Security-Policy (connect-src).
            - API_ORIGIN=http://localhost:8080
        ports:
            - '8081:80'
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
            interval: 5s
            timeout: 3s
            retries: 10

    db:
        restart: unless-stopped
        image: postgres:15
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dashboard
        ports:
            - '127.0.0.1:5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d dashboard']
            interval: 2s
            timeout: 5s
            retries: 15
        volumes:
            - db_data:/var/lib/postgresql/data

    ollama:
        restart: unless-stopped
        image: ollama/ollama:latest
        volumes:
            - ollama_data:/root/.ollama

volumes:
    auth_data:
    db_data:
    ollama_data:
