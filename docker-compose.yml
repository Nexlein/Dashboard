services:
    nginx:
        image: nginx:latest
        ports:
            - '8080:8080'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - server

    redis:
        image: redis:7
        ports:
            - '6379:6379'

    server:
        env_file:
            - ./backend/.env
        build:
            context: .
            dockerfile: backend/Dockerfile

        environment:
            - PORT=8080
            - DATABASE_URL=postgres://user:password@db:5432/dashboard
            - REDIS_URL=redis://redis:6379
        restart: on-failure
        deploy:
            replicas: 3
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    client:
        build:
            context: .
            dockerfile: frontend/Dockerfile

        ports:
            - '8081:80'

    db:
        image: postgres:15
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dashboard
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d dashboard']
            interval: 2s
            timeout: 5s
            retries: 15
        volumes:
            - db_data:/var/lib/postgresql/data

    ollama:
        image: ollama/ollama:latest
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama

volumes:
    db_data:
    ollama_data:
