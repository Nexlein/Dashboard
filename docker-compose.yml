services:
    nginx:
        restart: unless-stopped
        image: nginx:latest
        ports:
            - '8080:8080'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - server

    redis:
        restart: unless-stopped
        image: redis:7
        ports:
            - '6379:6379'

    server:
        env_file:
            - ./backend/.env
        build:
            context: .
            dockerfile: backend/Dockerfile

        environment:
            - PORT=8080
            - DATABASE_URL=postgres://user:password@db:5432/dashboard
            - REDIS_URL=redis://redis:6379
            # Creates the demo accounts (README) at startup when missing. Remove on a real
            # deployment: their passwords are public.
            - SEED_DEMO_DATA=true
            # Emails use the SMTP_* settings of backend/.env (Gmail, see the README).
        restart: unless-stopped
        deploy:
            replicas: 3
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Test inbox for the e2e tests only (they read the emailed codes from it):
    # docker compose --profile e2e up -d mailpit
    mailpit:
        profiles: [e2e]
        image: axllent/mailpit:v1.31
        ports:
            - '8025:8025' # web inbox and API
            - '1025:1025' # SMTP

    client:
        restart: unless-stopped
        build:
            context: .
            dockerfile: frontend/Dockerfile
        environment:
            # API origin allowed by the frontend Content-Security-Policy (connect-src).
            - API_ORIGIN=http://localhost:8080
        ports:
            - '8081:80'

    db:
        restart: unless-stopped
        image: postgres:15
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dashboard
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d dashboard']
            interval: 2s
            timeout: 5s
            retries: 15
        volumes:
            - db_data:/var/lib/postgresql/data

    ollama:
        restart: unless-stopped
        image: ollama/ollama:latest
        volumes:
            - ollama_data:/root/.ollama

volumes:
    db_data:
    ollama_data:
