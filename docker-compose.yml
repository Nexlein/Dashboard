services:
    server:
        env_file:
            - ./backend/.env
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        environment:
            - PORT=8080
            - DATABASE_URL=postgres://user:password@db:5432/dashboard
        restart: on-failure
        depends_on:
            - db
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    client:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '8081:80'

    db:
        image: postgres:15
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dashboard
        ports:
            - '5433:5432'
        volumes:
            - db_data:/var/lib/postgresql/data

    ollama:
        image: ollama/ollama:latest
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama

volumes:
    db_data:
    ollama_data:
