name: CI Pipeline
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 20
            - name: Install dependencies and Test
              run: |
                  cd backend
                  npm install
                  npm test
            - name: Test Docker Compose Build
              run: docker compose build
