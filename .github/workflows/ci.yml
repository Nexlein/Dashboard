name: CI Pipeline
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_gdpr_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_gdpr_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v3
            - name: Prepare example environment
              run: cp backend/.env.example backend/.env
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 20
            - name: Install dependencies and Test
              run: |
                  cd backend
                  npm ci
                  npm test
            - name: Verify GDPR flows with PostgreSQL
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
              run: |
                  npx prisma db push
                  npm run test:gdpr-integration
            - name: Test Docker Compose Build
              run: docker compose build

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 24
            - name: Test and build frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm test
                  npm run build
                  npm run lint
