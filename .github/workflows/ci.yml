name: CI Pipeline

on:
    push:
        branches: [main, master]
    # Every PR, including PRs stacked on another feature branch.
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint

    test-shared:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm ci
            - run: npm test -w shared

    test-backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_gdpr_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_gdpr_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: cp backend/.env.example backend/.env
            - run: npm ci
            - run: npm run build -w shared
            - run: cd backend && npx prisma generate
            - run: npm run typecheck -w backend
            - name: Run backend tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  BETTER_AUTH_SECRET: dummy_better_auth_secret_with_32_characters
                  ENCRYPTION_KEY: dummy_encryption_key_with_at_least_32_chars
              run: npm test -w backend -- --coverage
            - name: Apply migrations and check they match the schema
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
              # migrate diff exits with 2 when schema.prisma has changes without a migration.
              run: |
                  npx prisma migrate deploy
                  npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
            - name: Authentication and GDPR flows against PostgreSQL
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
              run: npm run test:integration

    test-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm ci
            - run: npm run build -w shared
            - run: npm test -w frontend -- --coverage

    test-e2e:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_e2e_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_e2e_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            # Catches the verification codes the e2e tests read (backend/.env.example: port 1025).
            mailpit:
                image: axllent/mailpit:v1.31
                ports:
                    - 1025:1025
                    - 8025:8025
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm ci
            - run: npm run build -w shared
            - run: cp backend/.env.example backend/.env
            - run: npm run db:deploy -w backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_e2e_test
            - run: npm exec -w e2e -- playwright install --with-deps chromium
            - run: npm run test:e2e
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_e2e_test
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: e2e/playwright-report/
                  retention-days: 7

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: docker compose build
