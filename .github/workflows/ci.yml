name: CI Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint -w frontend
            - run: npx eslint .
            - run: npx prettier --check .

    test-shared:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npm test -w shared

    test-backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_gdpr_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_gdpr_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: cp backend/.env.example backend/.env
            - run: npm ci
            - run: npm run build -w shared
            - run: cd backend && npx prisma generate
            - name: Run backend tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  JWT_SECRET: dummy_jwt_secret_with_at_least_32_characters
                  ENCRYPTION_KEY: dummy_encryption_key_with_at_least_32_chars
              run: npm test -w backend -- --coverage
            - name: Verify GDPR flows
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
              run: |
                  npx prisma db push
                  npm run test:gdpr-integration

    test-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npm run build -w shared
            - run: cd frontend && npm run test -- --coverage

    test-e2e:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_e2e_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_e2e_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            - run: npm ci
            - run: npm run build -w shared
            - run: cp backend/.env.example backend/.env
            - run: cd backend && npx prisma db push
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_e2e_test
            - run: cd e2e && npm install
            - run: cd e2e && npx playwright install --with-deps
            - run: cd e2e && npx playwright test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_e2e_test
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: e2e/playwright-report/
                  retention-days: 7

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker compose build
