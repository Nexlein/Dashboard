name: Test

on:
    push:
        branches: ['main']
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - run: npm ci
            - working-directory: frontend
              run: npm test -- --coverage
            - name: Upload Frontend Coverage
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  retention-days: 7

    backend-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dashboard_gdpr_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d dashboard_gdpr_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'
            - run: npm ci
            - working-directory: backend
              run: cp .env.example .env
            - working-directory: backend
              env:
                  ENCRYPTION_KEY: ci-test-encryption-key-for-backend-unit-tests
              run: npm test -- --coverage
            - name: Upload Backend Coverage
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  retention-days: 7
            - working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
                  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_gdpr_test
              run: |
                  npx prisma db push
                  npm run test:gdpr-integration

    e2e-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: cp backend/.env.example backend/.env
            - run: docker compose up -d --build
            - name: Wait for services to be ready
              run: |
                  for i in $(seq 1 30); do
                    curl -sf http://localhost:8080/health && echo "Backend ready" && break
                    echo "Attempt $i/30, retrying in 5s..."
                    sleep 5
                    if [ "$i" -eq 30 ]; then echo "Backend failed to start"; exit 1; fi
                  done
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - working-directory: frontend
              run: npx playwright install --with-deps chromium
            - working-directory: frontend
              env:
                  BASE_URL: http://localhost:8081
              run: npx playwright test --project=chromium
            - name: Upload Playwright Report
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: frontend/playwright-report/
                  retention-days: 7
