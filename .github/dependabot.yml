version: 2
updates:
    # npm workspaces share the root package-lock.json
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          minor-and-patch:
              update-types: ['minor', 'patch']
    - package-ecosystem: 'docker'
      directories: ['/backend', '/frontend']
      schedule:
          interval: 'weekly'
      ignore:
          # Node majors move together with .nvmrc and CI, once the new major is LTS.
          - dependency-name: 'node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
